backend:
  name: git-gateway
  branch: main

local_backend: false

media_folder: "images"
public_folder: "/images"

collections:
  - name: "disponibilites"
    label: "Disponibilités"
    files:
      - file: "content/disponibilites.json"
        label: "Séjours indisponibles"
        name: "disponibilites"
        fields:
          - label: "Séjours réservés / indisponibles"
            name: "sejours_indisponibles"
            widget: "list"
            fields:
              - { label: "Date d'arrivée", name: "debut", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Date de départ", name: "fin", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Motif (optionnel)", name: "motif", widget: "string", required: false, default: "Réservé" }
